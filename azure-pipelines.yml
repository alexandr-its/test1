trigger:
  branches:
    include:
      - main  # Триггер на main

stages: 
- stage: StartEC2
  jobs:
  - job: StartInstance
    pool: 
      vmImage: ubuntu-latest

    steps:
    - script: |
        export AWS_DEFAULT_REGION=eu-west-1
        INSTANCE_ID=$(aws ec2 run-instances \
          --launch-template LaunchTemplateName=test-azure-agent-rhel \
          --count 1 \
          --query 'Instances[0].InstanceId' \
          --output text)
        
        echo "Instance started with ID: $INSTANCE_ID"
        echo "##vso[task.setvariable variable=INSTANCE_ID]$INSTANCE_ID"
      displayName: "Run RHEL agent and capture Instance ID"

    - task: AWSCLI@1
      displayName: "wait RHEL agent"
      inputs:
        awsCredentials: '$(AWS_CREDS)'  # Подключение к AWS в Azure DevOps
        regionName: 'eu-west-1'
        awsCommand: "ec2"
        awsSubCommand: "wait instance-running"
        awsArguments: "--instance-ids $(INSTANCE_ID)"
      
- stage: Build
  dependsOn: StartEC2
  jobs:
  - job: BuildOnSelfHosted
    pool:
      name: 'test' 
      demands:
       - agent.name -equals 'aws-rhel-agent' # Пул, в котором зарегистрирован агент на EC2
    steps:
    - script: |
        echo "$(cat /etc/os-release)"
      displayName: "Run Build Task"

- stage: StopEC2
  dependsOn: Build
  condition: always()  # Гарантируем, что EC2 выключится, даже если билд упадёт
  jobs:
  - job: StopInstance
    pool: 
      vmImage: ubuntu-latest
    steps:
    - task: AWSCLI@1
      inputs:
        awsCredentials: '$(AWS_CREDS)'  # Подключение к AWS в Azure DevOps
        regionName: 'eu-west-1'
        awsCommand: "ec2"
        awsSubCommand: "terminate-instances"
        awsArguments: "--instance-ids $(INSTANCE_ID)"
