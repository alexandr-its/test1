trigger:

  branches:
    include:
      - main

stages:
- stage: StartEC2
  jobs:
  - job: StartInstance
    pool: 
      vmImage: ubuntu-latest

    steps:
    - task: AWSShellScript@1
      displayName: "Run EC2 Instance"
      inputs:
        awsCredentials: '$(AWS_CREDS)'  # Используем Service Connection AWS
        regionName: 'eu-west-1'
        scriptType: 'inline'
        inlineScript: |
          INSTANCE_ID=$(aws ec2 run-instances \
            --launch-template LaunchTemplateName=test-azure-agent-rhel \
            --count 1 \
            --query 'Instances[0].InstanceId' \
            --output text)
          echo "Instance started with ID: $INSTANCE_ID"
          
          # Устанавливаем переменную для использования в следующих шагах
          echo "##vso[task.setvariable variable=INSTANCE_ID]$INSTANCE_ID"
      
    - task: AWSShellScript@1
      displayName: "Wait for EC2 instance to be running"
      inputs:
        awsCredentials: '$(AWS_CREDS)'
        regionName: 'eu-west-1'
        scriptType: 'inline'
        inlineScript: |
          aws ec2 wait instance-running --instance-ids $(INSTANCE_ID)


- stage: Build
  dependsOn: StartEC2
  jobs:
  - job: BuildOnSelfHosted
    pool:
      name: 'test' 
      demands:
        - Agent.Name -equals 'aws-rhel-agent'
    steps:
    - script: |
        echo "$(cat /etc/os-release)"
      displayName: "Run Build Task"

- stage: StopEC2
  dependsOn: Build
  condition: always()
  jobs:
  - job: StopInstance
    pool: 
      vmImage: ubuntu-latest
    steps:
    - task: AWSCLI@1
      inputs:
        awsCredentials: '$(AWS_CREDS)'  # Используем Service Connection AWS
        regionName: 'eu-west-1'
        awsCommand: "ec2"
        awsSubCommand: "terminate-instances"
        awsArguments: "--instance-ids $(INSTANCE_ID)"
